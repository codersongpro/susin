name: 릴리즈 빌드

# 릴리즈하는 방법은 두 가지다.
#
#   1) 태그를 민다:  git tag v2.0.0 && git push origin v2.0.0
#   2) Actions 탭 [Run workflow] 에서 version 에 v2.0.0 을 적는다
#      (태그를 밀 권한이 없어도 된다. 러너가 태그까지 만들어 준다.)
#
# version 을 비워 두고 돌리면 빌드만 하고 exe 를 artifact 로만 남긴다 —
# 태그를 붙이기 전에 빌드가 되는지 확인할 때 쓴다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '릴리즈할 버전 (예: v2.0.0). 비워 두면 빌드만 하고 릴리즈는 만들지 않습니다.'
        required: false
        default: ''

permissions:
  contents: write        # Release 를 만들고 파일을 붙이기 위해 필요

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # GUI 없이 도는 부분만 돈다. tkinter 가 없어도 통과해야 한다.
      - run: pip install openpyxl
      - run: python -m unittest discover -s tests -v

  build:
    name: Windows exe 빌드
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Windows 러너 콘솔은 cp1252 다. 한글을 찍는 스크립트가 전부 여기서 죽는다.
      # 단계마다 거는 대신 잡 전체에 건다.
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 앱이 뜨는지 확인
        # 탭 생성·출구 전환·명단 추출까지 실제로 돌려 본다.
        # 여기서 깨지면 사용자가 exe 를 받고 나서야 알게 된다.
        timeout-minutes: 3
        run: python tools/smoke_gui.py

      - name: 버전 정보 리소스 만들기
        # exe 에 제품명·회사명·설명이 비어 있으면 백신이 의심 점수를 더 준다
        run: python tools/make_version_file.py version_info.txt

      - name: exe 빌드 (onefile)
        run: >
          pyinstaller --onefile --windowed --name sintongpick
          --version-file version_info.txt
          --distpath dist-onefile --workpath build-onefile
          --add-data "org_db.json;."
          --add-data "org_codes.json;."
          --add-data "assets/수신그룹_양식.xlsx;assets" --add-data "assets/guide;assets/guide"
          --hidden-import pyperclip
          --hidden-import openpyxl
          --hidden-import PIL
          --hidden-import win32com.client
          --hidden-import olefile
          main.py

      - name: 폴더형 빌드 (onedir)
        # onefile 은 실행할 때 자기 안의 압축을 임시 폴더에 풀고 실행한다.
        # 그 동작이 드로퍼 악성코드와 구조가 같아 백신 휴리스틱에 자주 걸린다.
        # onedir 는 그 단계가 없어 오탐이 훨씬 적다. 두 가지를 모두 배포한다.
        run: >
          pyinstaller --onedir --windowed --name sintongpick
          --version-file version_info.txt
          --distpath dist-onedir --workpath build-onedir
          --add-data "org_db.json;."
          --add-data "org_codes.json;."
          --add-data "assets/수신그룹_양식.xlsx;assets" --add-data "assets/guide;assets/guide"
          --hidden-import pyperclip
          --hidden-import openpyxl
          --hidden-import PIL
          --hidden-import win32com.client
          --hidden-import olefile
          main.py

      - name: 폴더형을 zip 으로 묶기
        shell: pwsh
        run: |
          Copy-Item README.md dist-onedir/sintongpick/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist-onedir/sintongpick/* -DestinationPath sintongpick-windows.zip -Force

      - name: 빌드 결과 확인
        shell: bash
        run: |
          ls -la dist-onefile/ dist-onedir/sintongpick/ | head -30
          test -f dist-onefile/sintongpick.exe
          test -f dist-onedir/sintongpick/sintongpick.exe
          test -f sintongpick-windows.zip
          echo "--- SHA256"
          sha256sum dist-onefile/sintongpick.exe sintongpick-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sintongpick-windows
          path: |
            dist-onefile/sintongpick.exe
            sintongpick-windows.zip
          retention-days: 14

      - name: 릴리즈 노트 만들기
        # CHANGELOG.md 의 해당 버전 단락 + 고정 안내문(docs/release_footer.md).
        # 본문을 워크플로에 박아 두면 버전이 바뀌어도 그대로 남는다.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        run: python tools/make_release_notes.py "${{ inputs.version || github.ref_name }}" release_notes.md

      - name: Release 에 붙이기
        # 태그 push 로 왔거나, 손으로 돌리면서 version 을 적었을 때만
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          # 손으로 돌린 경우 여기 적힌 이름으로 태그를 새로 만든다
          tag_name: ${{ inputs.version || github.ref_name }}
          # 태그를 만들 커밋을 못 박는다. 이걸 비워 두면 GitHub 이 저장소
          # 기본 브랜치의 끝에 태그를 만들어, 방금 빌드한 코드와 다른 커밋에
          # 태그가 붙는다. v2.2.0 부터 v2.2.3 까지 그렇게 어긋났다.
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.version || github.ref_name }}
          files: |
            dist-onefile/sintongpick.exe
            sintongpick-windows.zip
          body_path: release_notes.md
          generate_release_notes: true
